name: CI - Guillotina de Despliegue

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Código Fuente
      uses: actions/checkout@v4

    - name: Configurar Entorno Node.js (v20)
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Instalación Inmutable de Dependencias
      run: npm ci

    - name: Linter Estricto (Prevención de Código Muerto)
      run: npm run lint --if-present

    - name: Guillotina de Tipos y Compilación (Zero-Trust Build)
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      run: npm run build
