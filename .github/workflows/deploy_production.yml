name: FuelFlow 3.0 - Production Zero-Trust Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy-vault:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 3. Link Supabase Project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref $SUPABASE_PROJECT_REF

      - name: 4. Push Database Migrations (Capa 0)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db push

      - name: 5. Deploy Edge Functions (Perímetro y Sello)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase functions deploy telemetry-ingest --no-verify-jwt
          supabase functions deploy seal-certificate --no-verify-jwt

      - name: 6. Inject Production Secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase secrets set IOT_INGEST_SECRET="${{ secrets.IOT_INGEST_SECRET }}"
          supabase secrets set B2B_WEBHOOK_SECRET="${{ secrets.B2B_WEBHOOK_SECRET }}"
